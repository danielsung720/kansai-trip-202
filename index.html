<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>關西五日自由行・旅遊說明書</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#2b2b2b; --muted:#7a756c;
    --line:#e7e2d8; --accent:#c0392b; --accent2:#1f6f6b; --gold:#b8893b;
    --shadow:0 2px 10px rgba(0,0,0,.06); --radius:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","PingFang TC","Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent2);text-decoration:none}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

  /* Header */
  .hero{
    background:
      linear-gradient(135deg,rgba(232,99,90,.78) 0%,rgba(230,145,60,.55) 42%,rgba(138,107,191,.82) 100%),
      url("https://images.unsplash.com/photo-1493997181344-712f2f19d87a?auto=format&fit=crop&w=1600&q=70") center 35%/cover no-repeat,
      linear-gradient(135deg,#e8635a 0%,#8a6bbf 100%);
    color:#fff;padding:34px 16px 26px;text-align:center;position:relative;overflow:hidden;
  }
  .hero h1,.hero .dates{text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .hero h1{margin:0;font-size:28px;letter-spacing:2px;font-weight:800}
  .hero .dates{margin-top:6px;font-size:15px;opacity:.92;letter-spacing:1px}
  .hero .hotel{
    display:flex;gap:6px;align-items:center;width:fit-content;max-width:90%;margin:14px auto 0;
    background:rgba(255,255,255,.15);padding:7px 14px;border-radius:999px;font-size:13.5px;
  }
  .hero .hotel a{color:#fff;text-decoration:underline}
  /* 電子數字時鐘 */
  .clock{
    display:flex;flex-direction:column;align-items:center;width:fit-content;margin:14px auto 0;
    background:rgba(0,0,0,.30);border:1px solid rgba(255,255,255,.15);
    border-radius:14px;padding:8px 22px;box-shadow:inset 0 0 14px rgba(0,0,0,.35)
  }
  .clock .time{
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Courier New",monospace;
    font-size:32px;font-weight:700;line-height:1.1;letter-spacing:3px;
    color:#ffd23f;font-variant-numeric:tabular-nums;
    text-shadow:0 0 8px rgba(255,210,63,.7),0 0 2px rgba(255,210,63,.95)
  }
  .clock .date{font-size:12.5px;letter-spacing:2px;color:rgba(255,255,255,.85);margin-bottom:3px}

  /* Status */
  .status{
    display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
    font-size:12px;color:var(--muted);padding:10px 16px;background:#efece4;border-bottom:1px solid var(--line)
  }
  .status .dot{width:8px;height:8px;border-radius:50%;background:#2e9e5b}
  .status.offline .dot{background:var(--gold)}
  .status button{
    border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px;
    font-size:12px;cursor:pointer;color:var(--ink)
  }
  .status button:active{transform:scale(.96)}

  /* Nav */
  nav.tabs{
    position:sticky;top:0;z-index:20;background:rgba(246,244,239,.95);
    backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line);
    display:flex;gap:8px;justify-content:safe center;overflow-x:auto;padding:10px 16px;scrollbar-width:none
  }
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs a{
    flex:0 0 auto;font-size:13px;font-weight:700;color:var(--muted);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;white-space:nowrap
  }
  nav.tabs a .d{display:block;font-size:10px;font-weight:600;opacity:.7;letter-spacing:.5px}
  nav.tabs a.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
  nav.tabs a.active .d{opacity:.85}
  nav.tabs a.today::after{content:"今日";display:inline-block;margin-left:5px;font-size:9px;background:var(--accent);color:#fff;padding:0 5px;border-radius:6px;vertical-align:middle}

  /* Single-page view：一次只顯示一個 page */
  .page{display:none;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* Hero image banner（每頁頂部大圖） */
  .hero-img{
    height:190px;border-radius:18px;margin:16px 0 18px;position:relative;overflow:hidden;
    background:#ccc center/cover no-repeat;box-shadow:var(--shadow);display:flex;align-items:flex-end
  }
  .hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.68) 100%)}
  .hero-img .cap{position:relative;z-index:1;color:#fff;padding:16px 18px}
  .hero-img .cap .badge{display:inline-block;background:var(--day,var(--accent));font-size:11px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:7px}
  .hero-img .cap h2{margin:6px 0 0;font-size:22px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .hero-img .cap .wx{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:7px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);font-size:11px;font-weight:700;padding:5px 11px;border-radius:9px;line-height:1.4}
  .hero-img .cap .wx .wx-row{display:inline-flex;align-items:center;gap:9px;white-space:nowrap}
  .hero-img .cap .wx .wx-row.sub{opacity:.92}
  .hero-img .cap .wx.muted{flex-direction:row;align-items:center;gap:5px}
  .hero-img .cap .wx .wx-ico{font-size:13px}
  .hero-img .cap .wx .wx-temp b{font-weight:800}
  .hero-img .cap .wx .wx-temp .lo{opacity:.8;font-weight:600}
  .hero-img .cap .wx .wx-pop{font-weight:700;opacity:.95}
  .hero-img .cap .wx.muted{opacity:.85;font-weight:600}

  /* Day section */
  section{scroll-margin-top:64px}
  .day-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 4px}
  .day-badge{
    background:var(--accent);color:#fff;font-weight:800;font-size:12px;
    padding:4px 10px;border-radius:8px;letter-spacing:1px;white-space:nowrap
  }
  .day-head h2{margin:0;font-size:19px;font-weight:800}
  .summary{
    margin:0 2px 16px;color:#5a544b;font-size:13.5px;font-weight:600;line-height:1.7;
    background:#fff;
    background:color-mix(in srgb, var(--day,var(--accent2)) 9%, #fff);
    border:1px solid var(--line);border-left:5px solid var(--day,var(--accent2));
    border-radius:12px;padding:10px 14px
  }
  .summary .summary-label{
    display:inline-block;background:var(--day,var(--accent2));color:#fff;
    font-size:11px;font-weight:800;letter-spacing:1px;padding:2px 9px;border-radius:7px;margin-right:8px
  }

  /* Timeline */
  .tl{position:relative;margin-left:6px;padding-left:18px;
    border-left:2px solid var(--line);
    border-left:2px solid color-mix(in srgb, var(--day,var(--accent2)) 35%, var(--line))}
  .ev{position:relative;padding:0 0 16px}
  .ev::before{
    content:"";position:absolute;left:-25px;top:5px;width:11px;height:11px;border-radius:50%;
    background:#fff;border:3px solid var(--day,var(--accent2))
  }
  .ev .time{font-size:12.5px;font-weight:800;color:var(--day,var(--accent2));letter-spacing:.5px}
  .ev .title{font-size:15.5px;font-weight:700;margin:1px 0 2px}
  .ev .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ev .meta .ico{font-style:normal}
  .ev .dur{font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:999px;
    background:#eef3f2;color:var(--accent2);
    background:color-mix(in srgb, var(--day,var(--accent2)) 15%, #fff);
    color:color-mix(in srgb, var(--day,var(--accent2)) 75%, #333)}
  .ev .note{margin-top:4px;font-size:12.5px;color:var(--accent);background:#fbecea;border-radius:8px;padding:4px 9px;display:inline-block}

  /* Cards (meals / souvenirs / tips) */
  .sub-h{font-size:14px;font-weight:800;margin:18px 2px 8px;color:var(--ink);display:flex;align-items:center;gap:7px;padding-left:9px;border-left:4px solid var(--day,var(--accent2))}
  .pill-tag{font-size:11px;font-weight:700;color:#fff;background:var(--gold);padding:2px 9px;border-radius:999px}
  .cards{display:grid;gap:8px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;justify-content:space-between
  }
  .card .c-main{min-width:0}
  .card .c-title{font-size:14.5px;font-weight:700;line-height:1.4}
  .card .c-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .card .c-link{
    flex:0 0 auto;align-self:center;font-size:18px;text-decoration:none;
    background:#eef3f2;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center
  }
  .card .c-link:active{transform:scale(.94)}

  /* Flights */
  .flight{
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px
  }
  .flight .leg{background:var(--day,var(--accent2));color:#fff;font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px;white-space:nowrap}
  .flight{border-left:5px solid var(--day,var(--accent2))}
  .flight .route{font-weight:800;font-size:15px}
  .flight .fmeta{font-size:12.5px;color:var(--muted)}

  /* 互動地圖 */
  .map-leaflet{height:340px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:8px;background:#e6eaec}
  .map-leaflet .leaflet-tooltip.spot{
    background:#fff;border:1.5px solid var(--day,#e8635a);color:#222;font-weight:700;font-size:12px;
    border-radius:7px;padding:2px 8px;box-shadow:0 1px 5px rgba(0,0,0,.28);white-space:nowrap;cursor:pointer
  }
  .map-leaflet .leaflet-tooltip.spot.near{border-color:#b8893b;color:#7a5a1f}
  .map-leaflet .leaflet-tooltip.spot::before{display:none}
  .map-leaflet .leaflet-marker-icon{cursor:pointer}
  .map-legend{font-size:12.5px;color:var(--muted);margin:0 2px 16px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .map-legend i{font-style:normal;font-size:14px}
  .map-legend .legend-locate{cursor:pointer;border-radius:999px;padding:2px 8px;margin:-2px -2px;background:#eaf2ff;border:1px solid #cfe0ff;color:#2b6fd6;font-weight:700}
  .map-legend .legend-locate:active{background:#d6e8ff}
  .leaflet-bar a.locate-btn{display:flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:16px;line-height:1;text-decoration:none;background:#fff}
  .leaflet-bar a.locate-btn.on{background:#d6e8ff}
  .map-note{font-size:12.5px;color:var(--accent);background:#fbecea;border-radius:8px;padding:8px 11px;margin-bottom:14px}

  /* 颱風頁：嵌入式天氣圖 */
  .embed-wrap{height:400px;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;background:#e6eaec}
  .embed-wrap iframe{width:100%;height:100%;border:0;display:block}
  .ty-note{font-size:12.5px;line-height:1.6;color:var(--muted);background:#eef3f7;border:1px solid #d8e4ee;border-radius:10px;padding:11px 13px;margin-bottom:14px}
  .ty-note b{color:var(--ink)}

  /* 行李清單 */
  .pack-bar{position:sticky;top:54px;z-index:5;background:var(--bg);padding:10px 0 8px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .pack-bar .pack-txt{font-size:13.5px;font-weight:800;color:var(--ink);flex:0 0 auto}
  .pack-bar .pack-prog{flex:1 1 120px;height:10px;background:#e2ddd2;border-radius:99px;overflow:hidden;min-width:120px}
  .pack-bar .pack-prog i{display:block;height:100%;width:0;background:var(--day,var(--accent2));border-radius:99px;transition:width .25s}
  .pack-bar .pack-reset{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
  .pack-bar .pack-reset:active{background:#f0ece4}
  .pack-group{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:4px}
  .pack-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14.5px;color:var(--ink);user-select:none}
  .pack-item:last-child{border-bottom:0}
  .pack-item input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--day,var(--accent2));cursor:pointer}
  .pack-item.done span{text-decoration:line-through;color:var(--muted)}

  /* 提示 toast */
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(12px);background:rgba(28,28,28,.93);color:#fff;font-size:13px;font-weight:600;line-height:1.5;padding:10px 16px;border-radius:11px;z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 當日地圖（圖片版，選用） */
  .map-card{display:block;position:relative;margin:0 0 10px;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);box-shadow:var(--shadow);background:#fff}
  .map-card.broken{display:none}
  .map-img{display:block;width:100%;height:auto}
  .map-card .map-cap{position:absolute;left:0;bottom:0;right:0;color:#fff;font-size:13px;font-weight:700;
    padding:14px 12px 8px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6))}
  .map-card .map-zoom{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;color:#fff;
    background:rgba(0,0,0,.45);padding:3px 8px;border-radius:999px}

  .loading,.error{text-align:center;color:var(--muted);padding:40px 16px}
  .error{color:var(--accent)}
  footer{text-align:center;font-size:11.5px;color:var(--muted);margin-top:34px}
</style>
</head>

function rowsToObjects(rows){
  return rows.map(r=>{
    const o={};
    COLS.forEach((c,i)=>o[c]=(r[i]??"").toString().trim());
    return o;
  }).filter(o=>o.type);
}

/* 把 gviz 的 JSON 物件轉成我們的列陣列 */
function gvizRows(json){
  if(!json || !json.table || !json.table.rows) return [];
  return json.table.rows.map(row=>{
    const cells = row.c || [];
    return COLS.map((_,i)=>{
      const c = cells[i];
      if(!c) return "";
      return (c.f!=null ? c.f : (c.v!=null ? c.v : "")).toString();
    });
  }).filter(r=>TYPES.includes(r[0])); // 只留合法 type 值，順便濾掉表頭列
}

/* WMO weather code → [emoji, 文字] */
function wmoIcon(code){
  const m = {
    0:["☀️","晴"],1:["🌤️","晴時多雲"],2:["⛅","多雲"],3:["☁️","陰"],
    45:["🌫️","霧"],48:["🌫️","霧凇"],
    51:["🌦️","毛毛雨"],53:["🌦️","毛毛雨"],55:["🌦️","毛毛雨"],
    56:["🌧️","凍雨"],57:["🌧️","凍雨"],
    61:["🌧️","小雨"],63:["🌧️","中雨"],65:["🌧️","大雨"],
    66:["🌧️","凍雨"],67:["🌧️","凍雨"],
    71:["🌨️","小雪"],73:["🌨️","中雪"],75:["🌨️","大雪"],77:["🌨️","雪粒"],
    80:["🌦️","陣雨"],81:["🌦️","陣雨"],82:["⛈️","強陣雨"],
    85:["🌨️","陣雪"],86:["🌨️","陣雪"],
    95:["⛈️","雷雨"],96:["⛈️","雷雨冰雹"],99:["⛈️","雷雨冰雹"],
  };
  return m[code] || ["🌡️","—"];
}
/* 逐日抓取並填入 header */
function loadAllWeather(){
  WX_JOBS.forEach(job=>{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${job.lat}&longitude=${job.lon}`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,uv_index_max,sunrise,sunset`
      + `&timezone=Asia%2FTokyo&start_date=${job.date}&end_date=${job.date}`;
    fetch(url).then(r=>r.ok?r.json():Promise.reject()).then(j=>{
      const dd = j && j.daily;
      const el = document.getElementById(job.id);
      if(!el || !dd || !dd.time || !dd.time.length) throw 0;
      const [ico, txt] = wmoIcon(dd.weather_code[0]);
      const hi = Math.round(dd.temperature_2m_max[0]);
      const lo = Math.round(dd.temperature_2m_min[0]);
      const pop = dd.precipitation_probability_max ? dd.precipitation_probability_max[0] : null;
      const hhmm = s => String(s||"").slice(11,16);
      const rise = dd.sunrise ? hhmm(dd.sunrise[0]) : null;
      const set  = dd.sunset  ? hhmm(dd.sunset[0])  : null;
      const uv   = dd.uv_index_max ? Math.round(dd.uv_index_max[0]) : null;
      const psum = dd.precipitation_sum ? dd.precipitation_sum[0] : null;
      el.classList.remove("muted");
      const row1 = `<span class="wx-ico">${ico}</span><span>${txt}</span>`
        + `<span class="wx-temp"><b>${hi}°</b><span class="lo"> / ${lo}°</span></span>`
        + (pop!=null ? `<span class="wx-pop">☔ ${pop}%</span>` : "");
      const row2 = (rise!=null ? `<span>🌅 ${rise}</span>` : "")
        + (set!=null  ? `<span>🌇 ${set}</span>`  : "")
        + (uv!=null   ? `<span>☀️UV ${uv}</span>` : "")
        + (psum!=null ? `<span>💧 ${psum}mm</span>` : "");
      el.innerHTML = `<span class="wx-row">${row1}</span>` + (row2 ? `<span class="wx-row sub">${row2}</span>` : "");
    }).catch(()=>{
      const el = document.getElementById(job.id);
      if(el) el.innerHTML = `<span class="wx-ico">🌡️</span><span>天氣暫無資料</span>`;
    });
  });
}

    html:`<span style="display:block;width:14px;height:14px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)"></span>`});

/* 輕量提示 toast */
let _toastTimer=null;
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add("show");
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove("show"), 2400);
}
/* 複製文字到剪貼簿（含舊版瀏覽器 fallback） */
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta=document.createElement("textarea"); ta.value=t;
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); return true;
  }catch(e){ return false; }
}
/* 點地標：複製名稱並開啟 Google Maps 路線規劃（起點＝目前位置） */
function openDirections(s){
  const ok=copyText(s.n);
  const url=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.lat+","+s.lng)}`;
  window.open(url, "_blank", "noopener");
  toast(`${ok?"已複製「"+s.n+"」，":""}開啟 Google 地圖規劃路線 🚶`);
}
/* 點圖例藍點：對齊我的位置（未定位則自動開始定位並置中） */
function centerOnMe(map){
  if(!map) return;
  if(map._meMarker){ map.setView(map._meMarker.getLatLng(), Math.max(map.getZoom()||13, 16)); return; }
  if(map._locateBtn){ toggleLocate(map, map._locateBtn); toast("定位中…取得位置後將自動置中"); }
}
/* 「我的位置」藍點圖示 */
function meIcon(){
  return L.divIcon({className:"",iconSize:[20,20],iconAnchor:[10,10],
    html:`<span style="display:block;width:14px;height:14px;border-radius:50%;background:#2b7cff;border:3px solid #fff;box-shadow:0 0 0 4px rgba(43,124,255,.25),0 1px 4px rgba(0,0,0,.5)"></span>`});
}
/* 停止某地圖的定位監聽並移除標記 */
function stopLocate(map){
  if(!map) return;
  if(map._geoWatch!=null){ try{ navigator.geolocation.clearWatch(map._geoWatch); }catch(e){} map._geoWatch=null; }
  if(map._meMarker){ try{ map.removeLayer(map._meMarker); }catch(e){} map._meMarker=null; }
  if(map._meCircle){ try{ map.removeLayer(map._meCircle); }catch(e){} map._meCircle=null; }
}
/* 切換定位（點一下開始追蹤、再點關閉） */
function toggleLocate(map, btn){
  if(map._geoWatch!=null){ stopLocate(map); btn.classList.remove("on"); return; }
  if(!navigator.geolocation){ alert("此裝置／瀏覽器不支援定位功能"); return; }
  btn.classList.add("on");
  let centered=false;
  map._geoWatch = navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude, p.coords.longitude];
    const acc=p.coords.accuracy||0;
    if(!map._meMarker){
      map._meMarker = L.marker(ll,{icon:meIcon(),zIndexOffset:1000}).addTo(map)
        .bindTooltip("我的位置",{direction:"top",className:"spot",offset:[0,-6]});
      map._meMarker.on("click",()=>map.setView(map._meMarker.getLatLng(), Math.max(map.getZoom()||13, 16)));
      map._meCircle = L.circle(ll,{radius:acc,color:"#2b7cff",weight:1,fillColor:"#2b7cff",fillOpacity:.15}).addTo(map);
    }else{
      map._meMarker.setLatLng(ll); map._meCircle.setLatLng(ll).setRadius(acc);
    }
    if(!centered){ map.setView(ll, Math.max(map.getZoom()||13, 15)); centered=true; }
  }, err=>{
    btn.classList.remove("on");
    if(map._geoWatch!=null){ try{ navigator.geolocation.clearWatch(map._geoWatch); }catch(e){} map._geoWatch=null; }
    alert("無法取得位置："+(err && err.code===1 ? "已拒絕定位權限（請至瀏覽器設定開啟）" : (err&&err.message)||"未知錯誤"));
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}
/* 在地圖左上加入「我的位置」按鈕 */
function addLocateControl(map){
  const Ctl = L.Control.extend({
    options:{position:"topleft"},
    onAdd:function(){
      const a = L.DomUtil.create("a","leaflet-bar-part locate-btn");
      a.href="#"; a.title="顯示我的位置"; a.innerHTML="📍";
      L.DomEvent.on(a,"click",function(e){ L.DomEvent.stop(e); toggleLocate(map, a); });
      L.DomEvent.disableClickPropagation(a);
      map._locateBtn=a;
      return a;
    }
  });
  map.addControl(new Ctl());
}

let dayMaps = {};      // mapId -> {spots,color}
let leafletMaps = {};  // mapId -> Leaflet 實例

function initDayMap(id, spots, color){
  const box = document.getElementById(id);
  if(typeof L==="undefined" || !box) return null;
  const map = L.map(id,{scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
    {maxZoom:19,subdomains:"abcd",attribution:'&copy; OpenStreetMap、CARTO'}).addTo(map);
  const pts=[];
  spots.forEach(s=>{
    const mk=L.marker([s.lat,s.lng],{icon:pin(s.near?"#b8893b":color),riseOnHover:true}).addTo(map);
    mk.bindTooltip(s.n,{permanent:true,direction:"top",interactive:true,className:"spot"+(s.near?" near":""),offset:[0,-4]});
    mk.on("click",()=>openDirections(s));
    const tt=mk.getTooltip(); if(tt) tt.on("click",()=>openDirections(s));
    pts.push([s.lat,s.lng]);
  });
  if(pts.length) map.fitBounds(pts,{padding:[45,45],maxZoom:15});
  addLocateControl(map);
  return map;
}

function heroImg(img, badge, title, badgeColor, weatherId){
  const bg = isUrl(img) ? `background-image:url('${esc(img)}')` : "background:linear-gradient(135deg,#1f6f6b,#15514e)";
  const bc = badgeColor ? ` style="background:${badgeColor}"` : "";
  const wx = weatherId ? `<span class="wx muted" id="${weatherId}"><span class="wx-ico">⛅</span><span>天氣載入中…</span></span>` : "";
  return `<div class="hero-img" style="${bg}"><div class="cap"><span class="badge"${bc}>${esc(badge)}</span><h2>${esc(title)}</h2>${wx}</div></div>`;
}

function showPage(id, scroll){
  if(!id) return;
  document.querySelectorAll(".page").forEach(s=>s.classList.toggle("active", s.id===id));
  document.querySelectorAll("nav.tabs a").forEach(a=>{
    const on = a.dataset.page===id;
    a.classList.toggle("active", on);
    if(on){
      const c=a.dataset.color;
      a.style.background=c; a.style.borderColor=c; a.style.color="#fff";
      a.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
    }else{
      a.style.background=""; a.style.borderColor=""; a.style.color="";
    }
  });
  // 地圖延遲初始化（容器顯示後才有尺寸）
  const mid = "map-"+id;
  if(dayMaps[mid]){
    if(!leafletMaps[mid]){
      leafletMaps[mid] = initDayMap(mid, dayMaps[mid].spots, dayMaps[mid].color);
    }else{
      setTimeout(()=>{ try{ leafletMaps[mid].invalidateSize(); }catch(e){} }, 60);
    }
  }
  if(scroll) window.scrollTo({top:0,behavior:"smooth"});
}
function goPage(id){ location.hash=id; showPage(id,true); }
window.addEventListener("hashchange",()=>{ const id=location.hash.replace(/^#/,""); if(id) showPage(id,true); });
/* 點圖例「我的位置」藍點 → 對齊目前位置（事件委派，一次綁定） */
document.addEventListener("click",e=>{
  const el=e.target.closest(".legend-locate"); if(!el) return;
  e.preventDefault();
  centerOnMe(leafletMaps[el.dataset.map]);
});

/* 今日比對：把 6/6(六) 之類正規化成 6/6 */
function todayKey(){ const d=new Date(); return (d.getMonth()+1)+"/"+d.getDate(); }
function parseMD(s){ const m=String(s).match(/(\d{1,2})\/(\d{1,2})/); return m ? (parseInt(m[1],10)+"/"+parseInt(m[2],10)) : ""; }

function card(title, sub, url){
  const link = isUrl(url) ? `<a class="c-link" href="${esc(url)}" target="_blank" rel="noopener">${mapIcon(url)}</a>` : "";
  return `<div class="card"><div class="c-main"><div class="c-title">${esc(title)}</div>`+
         (sub?`<div class="c-sub">${esc(sub)}</div>`:"")+`</div>${link}</div>`;
}

/* ---------- 載入 ---------- */
function setStatus(text, offline){
  const s=document.getElementById("status");
  s.classList.toggle("offline",!!offline);
  document.getElementById("statusText").textContent=text;
}

/* 用 JSONP（script 注入）讀 gviz：不受 CORS 限制，file:// 與線上皆可 */
let _loadSeq = 0;
function load(){
  setStatus("讀取資料中…",false);
  const seq = ++_loadSeq;
  const cb = "__gvizCb" + seq;
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
            + `?tqx=out:json;responseHandler:${cb}`
            + `&sheet=${encodeURIComponent(SHEET_TAB)}&headers=1&_=${seq}_${(new Date()).getTime()}`;
  const script = document.createElement("script");
  let done = false;

  const cleanup = () => { delete window[cb]; script.remove(); };
  const fail = (err) => {
    if(done) return; done = true; clearTimeout(timer); cleanup();
    console.warn("讀取 Sheet 失敗，改用內建備援資料：", err);
    render(rowsToObjects(FALLBACK));
    setStatus("離線備援資料（未連到 data 頁籤）", true);
  };

  const timer = setTimeout(() => fail("timeout"), 10000);

  window[cb] = (json) => {
    if(done) return; done = true; clearTimeout(timer); cleanup();
    try{
      const rows = gvizRows(json);
      if(!rows.length) throw new Error("empty / 找不到 data 頁籤資料");
      render(rowsToObjects(rows));
      setStatus("已連線 Google Sheet ・ 即時資料", false);
    }catch(e){
      console.warn("解析 Sheet 失敗，改用內建備援資料：", e);
      render(rowsToObjects(FALLBACK));
      setStatus("離線備援資料（未連到 data 頁籤）", true);
    }
  };

  script.src = url;
  script.onerror = () => fail("script load error");
  document.head.appendChild(script);
}

/* 動態電子時鐘 */
function tickClock(){
  const el=document.getElementById("clock"); if(!el) return;
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  const wk=["日","一","二","三","四","五","六"][d.getDay()];
  el.querySelector(".date").textContent=`${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}（${wk}）`;
  el.querySelector(".time").textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
tickClock(); setInterval(tickClock,1000);

document.getElementById("refreshBtn").addEventListener("click",load);
load();
